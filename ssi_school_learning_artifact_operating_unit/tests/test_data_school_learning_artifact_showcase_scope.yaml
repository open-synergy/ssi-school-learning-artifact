        action: "create"
        model: "res.users"
        save_as: "user_a"
        values:
          name: "Master Scope User A"
          login: "master.scope.a@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF:
                  ssi_school_learning_artifact.school_learning_artifact_category_group",
                  "REF:
                  ssi_school_learning_artifact.school_learning_artifact_phase_group",
                  "REF:
                  ssi_school_learning_artifact.school_learning_artifact_dimension_group",
                  "REF:
                  ssi_school_learning_artifact.school_learning_artifact_rubric_group",
                  "REF:
                  ssi_school_learning_artifact.school_learning_artifact_curation_status_group",
                  "REF:
                  ssi_school_learning_artifact.school_learning_artifact_showcase_stage_group",
                  "REF:
                  ssi_school_learning_artifact.school_learning_artifact_showcase_channel_group",
