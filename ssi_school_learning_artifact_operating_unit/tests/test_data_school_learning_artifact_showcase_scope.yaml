        model: "school_learning_artifact_dimension"
        save_as: "dimension_a"
        values:
          name: "Scope Dimension a"
          code: "/"
          operating_unit_ids: [[6, 0, ["REC: ou_a.id"]]]

      - step: "Create dimension b"
        action: "create"
        model: "school_learning_artifact_dimension"
        save_as: "dimension_b"
        values:
          name: "Scope Dimension b"
          code: "/"
          operating_unit_ids: [[6, 0, ["REC: ou_b.id"]]]

      - step: "Create rubric global"
