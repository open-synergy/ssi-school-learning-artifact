scenarios:
  - name: "Users see the masters of their own operating units only"
    steps:
      - step: "Create partner of operating unit A"
        action: "create"
        model: "res.partner"
        save_as: "ou_a_partner"
        values:
          name: "Master Scope OU A Partner"

      - step: "Create partner of operating unit B"
        action: "create"
        model: "res.partner"
        save_as: "ou_b_partner"
        values:
          name: "Master Scope OU B Partner"

      - step: "Create operating unit A"
        action: "create"
        model: "operating.unit"
        save_as: "ou_a"
        values:
          name: "Master Scope OU A"
          code: "MSCOPEA"
          company_id: "REF: base.main_company"
          partner_id: "REC: ou_a_partner.id"

      - step: "Create operating unit B"
        action: "create"
        model: "operating.unit"
        save_as: "ou_b"
        values:
          name: "Master Scope OU B"
          code: "MSCOPEB"
          company_id: "REF: base.main_company"
          partner_id: "REC: ou_b_partner.id"

      - step: "Create failing curation status for the rubrics"
        action: "create"
        model: "school_learning_artifact_curation_status"
        save_as: "st_fail"
        values:
          name: "Master Scope Fail Status"
          code: "/"
          category: "rejected"

      - step: "Create category global"
        action: "create"
        model: "school_learning_artifact_category"
        save_as: "category_global"
        values:
          name: "Scope Category global"
          code: "/"

      - step: "Create category a"
        action: "create"
        model: "school_learning_artifact_category"
        save_as: "category_a"
        values:
          name: "Scope Category a"
          code: "/"
          operating_unit_ids: [[6, 0, ["REC: ou_a.id"]]]

      - step: "Create category b"
        action: "create"
        model: "school_learning_artifact_category"
        save_as: "category_b"
        values:
          name: "Scope Category b"
          code: "/"
          operating_unit_ids: [[6, 0, ["REC: ou_b.id"]]]

      - step: "Create phase global"
        action: "create"
        model: "school_learning_artifact_phase"
        save_as: "phase_global"
        values:
          name: "Scope Phase global"
          code: "/"

      - step: "Create phase a"
        action: "create"
        model: "school_learning_artifact_phase"
        save_as: "phase_a"
        values:
          name: "Scope Phase a"
          code: "/"
          operating_unit_ids: [[6, 0, ["REC: ou_a.id"]]]

      - step: "Create phase b"
        action: "create"
        model: "school_learning_artifact_phase"
        save_as: "phase_b"
        values:
          name: "Scope Phase b"
          code: "/"
          operating_unit_ids: [[6, 0, ["REC: ou_b.id"]]]

      - step: "Create dimension global"
