options:
  auto_refresh: true

setup:
  steps:
    - step: "Setup - create grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "Grade Type for Character Tag Test"
        code: "/"
        sequence: 10
    - step: "Setup - create school"
      action: "create"
      model: "school"
      save_as: "school"
      values:
        name: "School for Character Tag Test"
        code: "/"
        grade_type_id: "REC: grade_type.id"
    - step: "Setup - create grade"
      action: "create"
      model: "school_grade"
      save_as: "grade"
      values:
        name: "Grade for Character Tag Test"
        code: "/"
        sequence: 10
        type_id: "REC: grade_type.id"
    - step: "Setup - create grade class"
      action: "create"
      model: "school_grade_class"
      save_as: "grade_class"
      values:
        name: "Class for Character Tag Test"
        code: "/"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        capacity: 30
    - step: "Setup - create academic year"
      action: "create"
      model: "school_academic_year"
      save_as: "academic_year"
      values:
        name: "Year for Character Tag Test"
        code: "/"
        date_start: "2026-07-01"
        date_end: "2027-06-30"
    - step: "Setup - create contact"
      action: "create"
      model: "res.partner"
      save_as: "contact"
      values:
        name: "Student Contact for Character Tag Test"
    - step: "Setup - create student"
      action: "create"
      model: "school_student"
      save_as: "student"
      values:
        name: "Student for Character Tag Test"
        code: "/"
        contact_id: "REC: contact.id"
        school_id: "REC: school.id"
    - step: "Setup - create learning area"
      action: "create"
      model: "school_learning_artifact_area"
      save_as: "area"
      values:
        name: "Area for Character Tag Test"
        code: "/"
        school_id: "REC: school.id"
        area_type: "subject"
    - step: "Setup - create category"
      action: "create"
      model: "school_learning_artifact_category"
      save_as: "category"
      values:
        name: "Category for Character Tag Test"
        code: "/"
    - step: "Setup - create privacy notice"
      action: "create"
      model: "partner_consent_notice"
      save_as: "notice"
      values:
        name: "Notice for Character Tag Test"
        code: "/"
        version: "1.0"
        body: "Privacy notice text"
    - step: "Setup - create assessment purpose"
      action: "create"
      model: "partner_consent_purpose"
      save_as: "purpose_assessment"
      values:
        name: "Purpose assessment for Character Tag Test"
        code: "/"
        learning_artifact_usage: "assessment"

    - step: "Setup - create indicator grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type2"
      values:
        name: "Indicator Grade Type for Character Tag Test"
        code: "/"
        sequence: 40
    - step: "Setup - create indicator school"
      action: "create"
      model: "school"
      save_as: "school2"
      values:
        name: "Indicator School for Character Tag Test"
        code: "/"
        grade_type_id: "REC: grade_type2.id"
    - step: "Setup - create grade 1"
      action: "create"
      model: "school_grade"
      save_as: "grade_1"
      values:
        name: "Grade 1 for Indicator Test"
        code: "/"
        sequence: 10
        type_id: "REC: grade_type2.id"
    - step: "Setup - create grade 2"
      action: "create"
      model: "school_grade"
      save_as: "grade_2"
      values:
        name: "Grade 2 for Indicator Test"
        code: "/"
        sequence: 20
        type_id: "REC: grade_type2.id"
    - step: "Setup - create grade 4"
      action: "create"
      model: "school_grade"
      save_as: "grade_4"
      values:
        name: "Grade 4 for Indicator Test"
        code: "/"
        sequence: 30
        type_id: "REC: grade_type2.id"
    - step: "Setup - create class of grade 1"
      action: "create"
      model: "school_grade_class"
      save_as: "class_1"
      values:
        name: "Class 1 for Indicator Test"
        code: "/"
        school_id: "REC: school2.id"
        grade_id: "REC: grade_1.id"
        capacity: 30
    - step: "Setup - create class of grade 4"
      action: "create"
      model: "school_grade_class"
      save_as: "class_4"
      values:
        name: "Class 4 for Indicator Test"
        code: "/"
        school_id: "REC: school2.id"
        grade_id: "REC: grade_4.id"
        capacity: 30
    - step: "Setup - create indicator contact"
      action: "create"
      model: "res.partner"
      save_as: "contact2"
      values:
        name: "Indicator Student Contact for Character Tag Test"
    - step: "Setup - create indicator student"
      action: "create"
      model: "school_student"
      save_as: "student2"
      values:
        name: "Indicator Student for Character Tag Test"
        code: "/"
        contact_id: "REC: contact2.id"
        school_id: "REC: school2.id"
    - step: "Setup - create indicator learning area"
      action: "create"
      model: "school_learning_artifact_area"
      save_as: "area2"
      values:
        name: "Indicator Area for Character Tag Test"
        code: "/"
        school_id: "REC: school2.id"
        area_type: "subject"

scenarios:
  - name: "CRUD of the grade status lines inline on the indicator"
    steps:
      - step: "Create construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "Construct S1"
          code: "CT-S1"
      - step: "Create sub-construct a"
        action: "create"
        model: "school_character_subconstruct"
        save_as: "sub_a"
        values:
          name: "Sub-construct a S1"
          code: "SA-S1"
          construct_id: "REC: construct.id"
      - step: "Create sub-construct b"
        action: "create"
        model: "school_character_subconstruct"
        save_as: "sub_b"
        values:
          name: "Sub-construct b S1"
          code: "SB-S1"
          construct_id: "REC: construct.id"
      - step: "Create second grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_2"
        values:
          name: "Second Grade Type S1"
          code: "/"
          sequence: 20
      - step: "Create indicator indicator"
        action: "create"
        model: "school_character_indicator"
        save_as: "indicator"
        values:
          name: "Indicator indicator S1"
          code: "IND-indicator-S1"
          construct_id: "REC: construct.id"
          subconstruct_id: "REC: sub_a.id"
          grade_status_ids:
            - - 0
              - 0
              - grade_type_id: "REC: grade_type.id"
                status: "effective"
      - step: "Assert one line"
        action: "assert"
        target: "indicator"
        asserts:
          grade_status_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
      - step: "Add a second line inline"
        action: "write"
        target: "indicator"
        values:
          grade_status_ids:
            - - 0
              - 0
              - grade_type_id: "REC: grade_type_2.id"
                status: "partial"
      - step: "Assert two lines"
        action: "assert"
        target: "indicator"
        asserts:
          grade_status_ids:
            type: "o2m"
            check: "count"
            expected_count: 2
      - step: "Find the second line"
        action: "search"
        model: "school_character_indicator_grade_status"
        save_as: "line_2"
        domain:
          - ["indicator_id", "=", "REC: indicator.id"]
          - ["grade_type_id", "=", "REC: grade_type_2.id"]
        limit: 1
        expect_count: 1
      - step: "Assert status of the second line"
        action: "assert"
        target: "line_2"
        asserts:
          status:
            type: "value"
            expected: "partial"
      - step: "Write status of the second line"
        action: "write"
        target: "line_2"
        values:
          status: "not_effective"
      - step: "Assert status after write"
        action: "assert"
        target: "line_2"
        asserts:
          status:
            type: "value"
            expected: "not_effective"
      - step: "Unlink the second line"
        action: "unlink"
        target: "line_2"
      - step: "Assert one line again"
        action: "assert"
        target: "indicator"
        asserts:
          grade_status_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
  - name: "Two status lines of the same grade type are rejected"
    steps:
      - step: "Create construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "Construct S2"
          code: "CT-S2"
      - step: "Create sub-construct a"
        action: "create"
        model: "school_character_subconstruct"
        save_as: "sub_a"
        values:
          name: "Sub-construct a S2"
          code: "SA-S2"
          construct_id: "REC: construct.id"
      - step: "Create sub-construct b"
