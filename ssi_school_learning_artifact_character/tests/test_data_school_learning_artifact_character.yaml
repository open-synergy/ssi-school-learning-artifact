      - step: "Create sub-construct b"
        action: "create"
        model: "school_character_subconstruct"
        save_as: "sub_b"
        values:
          name: "Sub-construct b S4"
          code: "SB-S4"
          construct_id: "REC: construct.id"
      - step: "Create indicator indicator_a"
        action: "create"
        model: "school_character_indicator"
        save_as: "indicator_a"
        values:
          name: "Indicator indicator_a S4"
          code: "IND-indicator_a-S4"
          construct_id: "REC: construct.id"
          subconstruct_id: "REC: sub_a.id"
          grade_status_ids:
            - - 0
              - 0
              - grade_type_id: "REC: grade_type.id"
                status: "partial"
      - step: "Create indicator indicator_b"
        action: "create"
        model: "school_character_indicator"
        save_as: "indicator_b"
        values:
          name: "Indicator indicator_b S4"
          code: "IND-indicator_b-S4"
          construct_id: "REC: construct.id"
          subconstruct_id: "REC: sub_b.id"
          grade_status_ids:
            - - 0
              - 0
              - grade_type_id: "REC: grade_type.id"
                status: "not_effective"
      - step: "Create artifact artifact"
        action: "create"
        model: "school_learning_artifact"
        save_as: "artifact"
        values:
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          grade_class_id: "REC: grade_class.id"
          activity_name: "Character Activity"
          media_type: "photo"
          user_id: "REF: base.user_admin"
          student_ids: [[6, 0, ["REC: student.id"]]]
          learning_area_id: "REC: area.id"
          category_id: "REC: category.id"
          description: "one two three"
          link_url: "https://drive.example.com/file"
      - step: "Assert only the sub-construct a is allowed"
        action: "assert"
        target: "artifact"
        asserts:
          allowed_subconstruct_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: sub_a"
  - name: "A grade type without status lines is not filtered"
    steps:
      - step: "Create construct"
        action: "create"
        model: "school_character_construct"
