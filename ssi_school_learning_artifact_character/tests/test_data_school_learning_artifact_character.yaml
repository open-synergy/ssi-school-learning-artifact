        save_as: "sub_b"
        values:
          name: "Sub-construct b S3"
          code: "SB-S3"
          construct_id: "REC: construct.id"
      - step: "Create indicator indicator_a"
        action: "create"
        model: "school_character_indicator"
        save_as: "indicator_a"
        values:
          name: "Indicator indicator_a S3"
          code: "IND-indicator_a-S3"
          construct_id: "REC: construct.id"
          subconstruct_id: "REC: sub_a.id"
      - step: "Create artifact artifact"
        action: "create"
        model: "school_learning_artifact"
        save_as: "artifact"
        values:
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          grade_class_id: "REC: grade_class.id"
          activity_name: "Character Activity"
          media_type: "photo"
          user_id: "REF: base.user_admin"
          student_ids: [[6, 0, ["REC: student.id"]]]
          learning_area_id: "REC: area.id"
          category_id: "REC: category.id"
          description: "one two three"
          link_url: "https://drive.example.com/file"
      - step: "Assert both sub-constructs are allowed"
        action: "assert"
        target: "artifact"
        asserts:
          allowed_subconstruct_ids:
            type: "m2m"
            check: "contains"
            expected_records:
