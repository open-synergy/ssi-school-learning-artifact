        values:
          name: "Sub-construct b S7"
          code: "SB-S7"
          construct_id: "REC: construct.id"
      - step: "Create artifact with tag and not evident mark"
        action: "create"
        model: "school_learning_artifact"
        values:
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          grade_class_id: "REC: grade_class.id"
          activity_name: "Character Activity rejected"
          media_type: "photo"
          user_id: "REF: base.user_admin"
          student_ids: [[6, 0, ["REC: student.id"]]]
          learning_area_id: "REC: area.id"
          category_id: "REC: category.id"
          description: "one two three"
          link_url: "https://drive.example.com/file"
          primary_subconstruct_id: "REC: sub_a.id"
          character_not_evident: true
        expect_error:
          type: "ValidationError"
          message_contains: "not clearly evident"
      - step: "Create artifact artifact"
        action: "create"
        model: "school_learning_artifact"
        save_as: "artifact"
        values:
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          grade_class_id: "REC: grade_class.id"
          activity_name: "Character Activity not evident"
          media_type: "photo"
          user_id: "REF: base.user_admin"
          student_ids: [[6, 0, ["REC: student.id"]]]
          learning_area_id: "REC: area.id"
          category_id: "REC: category.id"
          description: "one two three"
          link_url: "https://drive.example.com/file"
      - step: "Mark the artifact as not clearly evident"
        action: "write"
        target: "artifact"
        values:
          character_not_evident: true
      - step: "Assert the mark is saved"
        action: "assert"
        target: "artifact"
        asserts:
          character_not_evident:
            type: "value"
            expected: true
      - step: "Add the dominant tag to the marked artifact"
        action: "write"
        target: "artifact"
        values:
          primary_subconstruct_id: "REC: sub_a.id"
        expect_error:
          type: "ValidationError"
          message_contains: "not clearly evident"
  - name: "Only the validator group can fill in the tags of a draft artifact"
    steps:
      - step: "Create user with the user group only"
        action: "create"
        model: "res.users"
        save_as: "plain_user"
        values:
          name: "Character Tester plain user"
          login: "character.plain@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_learning_artifact.school_learning_artifact_user_group",
                ],
              ],
            ]
      - step: "Create artifact artifact_validator"
        action: "create"
        model: "school_learning_artifact"
        save_as: "artifact_validator"
        values:
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          grade_class_id: "REC: grade_class.id"
          activity_name: "Character Activity validator"
          media_type: "photo"
          user_id: "REF: base.user_admin"
          student_ids: [[6, 0, ["REC: student.id"]]]
          learning_area_id: "REC: area.id"
          category_id: "REC: category.id"
          description: "one two three"
          link_url: "https://drive.example.com/file"
      - step: "Create artifact artifact_plain"
        action: "create"
        model: "school_learning_artifact"
        save_as: "artifact_plain"
        values:
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          grade_class_id: "REC: grade_class.id"
          activity_name: "Character Activity plain"
          media_type: "photo"
          user_id: "REC: plain_user.id"
          student_ids: [[6, 0, ["REC: student.id"]]]
          learning_area_id: "REC: area.id"
          category_id: "REC: category.id"
          description: "one two three"
          link_url: "https://drive.example.com/file"
      - step: "Assert the validator can tag a draft artifact"
        action: "assert"
        target: "artifact_validator"
        as_user: "base.user_admin"
        asserts:
          character_tag_ok:
            type: "value"
            expected: true
      - step: "Assert the user group alone cannot tag a draft artifact"
        action: "assert"
        target: "artifact_plain"
        as_user: "plain_user"
        asserts:
          character_tag_ok:
            type: "value"
            expected: false
