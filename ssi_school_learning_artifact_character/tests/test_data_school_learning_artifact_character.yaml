          code: "SA-S5"
          construct_id: "REC: construct.id"
      - step: "Create sub-construct b"
        action: "create"
        model: "school_character_subconstruct"
        save_as: "sub_b"
        values:
          name: "Sub-construct b S5"
          code: "SB-S5"
          construct_id: "REC: construct.id"
      - step: "Create other grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_other"
        values:
          name: "Other Grade Type S5"
          code: "/"
          sequence: 30
      - step: "Create indicator indicator_a"
        action: "create"
        model: "school_character_indicator"
        save_as: "indicator_a"
        values:
          name: "Indicator indicator_a S5"
          code: "IND-indicator_a-S5"
          construct_id: "REC: construct.id"
          subconstruct_id: "REC: sub_a.id"
          grade_status_ids:
            - - 0
              - 0
              - grade_type_id: "REC: grade_type_other.id"
                status: "partial"
      - step: "Create indicator indicator_b"
        action: "create"
        model: "school_character_indicator"
        save_as: "indicator_b"
        values:
          name: "Indicator indicator_b S5"
          code: "IND-indicator_b-S5"
          construct_id: "REC: construct.id"
          subconstruct_id: "REC: sub_b.id"
          grade_status_ids:
            - - 0
              - 0
              - grade_type_id: "REC: grade_type_other.id"
                status: "not_effective"
      - step: "Create artifact artifact"
        action: "create"
        model: "school_learning_artifact"
        save_as: "artifact"
        values:
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          grade_class_id: "REC: grade_class.id"
          activity_name: "Character Activity"
          media_type: "photo"
          user_id: "REF: base.user_admin"
          student_ids: [[6, 0, ["REC: student.id"]]]
          learning_area_id: "REC: area.id"
          category_id: "REC: category.id"
          description: "one two three"
          link_url: "https://drive.example.com/file"
      - step: "Assert both sub-constructs are allowed"
        action: "assert"
        target: "artifact"
        asserts:
          allowed_subconstruct_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: sub_a"
              - "REC: sub_b"
  - name: "A refused assessment consent does not block the character tag"
    steps:
      - step: "Create construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "Construct S6"
          code: "CT-S6"
      - step: "Create sub-construct a"
        action: "create"
        model: "school_character_subconstruct"
        save_as: "sub_a"
        values:
          name: "Sub-construct a S6"
          code: "SA-S6"
          construct_id: "REC: construct.id"
      - step: "Create sub-construct b"
        action: "create"
        model: "school_character_subconstruct"
        save_as: "sub_b"
        values:
          name: "Sub-construct b S6"
          code: "SB-S6"
          construct_id: "REC: construct.id"
      - step: "Create artifact artifact"
        action: "create"
        model: "school_learning_artifact"
        save_as: "artifact"
        values:
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          grade_class_id: "REC: grade_class.id"
          activity_name: "Character Activity"
          media_type: "photo"
          user_id: "REF: base.user_admin"
          student_ids: [[6, 0, ["REC: student.id"]]]
          learning_area_id: "REC: area.id"
          category_id: "REC: category.id"
          description: "one two three"
          link_url: "https://drive.example.com/file"
      - step: "Record grant full assessment consent"
        action: "create"
        model: "res.partner.consent"
        values:
          partner_id: "REC: contact.id"
          school_id: "REC: school.id"
          notice_id: "REC: notice.id"
          purpose_id: "REC: purpose_assessment.id"
          consent_type: "grant"
          consent_level: "full"
          consent_date: "2026-10-01 08:00:00"
          channel: "manual"
      - step: "Withdraw assessment consent later"
        action: "create"
        model: "res.partner.consent"
        values:
          partner_id: "REC: contact.id"
          school_id: "REC: school.id"
          notice_id: "REC: notice.id"
          purpose_id: "REC: purpose_assessment.id"
          consent_type: "withdraw"
          consent_date: "2026-10-02 08:00:00"
          channel: "manual"
      - step: "Assert the assessment consent is refused"
        action: "assert"
        target: "artifact"
        asserts:
          assessment_consent:
            type: "value"
            expected: "refused"
      - step: "Tag the artifact"
        action: "write"
        target: "artifact"
        values:
          primary_subconstruct_id: "REC: sub_a.id"
          secondary_subconstruct_id: "REC: sub_b.id"
      - step: "Assert the tags are saved"
        action: "assert"
        target: "artifact"
        asserts:
          primary_subconstruct_id:
            type: "m2o"
            expected: "REC: sub_a"
          secondary_subconstruct_id:
            type: "m2o"
            expected: "REC: sub_b"
  - name: "Not clearly evident forbids the dominant tag"
    steps:
      - step: "Create construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
          name: "Construct S7"
          code: "CT-S7"
      - step: "Create sub-construct a"
        action: "create"
        model: "school_character_subconstruct"
        save_as: "sub_a"
        values:
