        save_as: "sub_b"
        values:
          name: "Sub-construct b S2"
          code: "SB-S2"
          construct_id: "REC: construct.id"
      - step: "Create indicator indicator"
        action: "create"
        model: "school_character_indicator"
        save_as: "indicator"
        values:
          name: "Indicator indicator S2"
          code: "IND-indicator-S2"
          construct_id: "REC: construct.id"
          subconstruct_id: "REC: sub_a.id"
          grade_status_ids:
            - - 0
              - 0
              - grade_type_id: "REC: grade_type.id"
                status: "effective"
      - step: "Create a second line of the same grade type"
        action: "create"
        model: "school_character_indicator_grade_status"
        values:
          indicator_id: "REC: indicator.id"
          grade_type_id: "REC: grade_type.id"
          status: "partial"
        expect_error:
          type: "ValidationError"
          message_contains: "already has a status"
  - name: "Without status lines every active sub-construct can be tagged"
    steps:
      - step: "Create construct"
        action: "create"
        model: "school_character_construct"
        save_as: "construct"
        values:
