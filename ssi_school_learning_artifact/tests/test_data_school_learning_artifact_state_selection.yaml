scenarios:
  - name: "State selection xmlids are owned by this module"
    steps:
      - step: "Get draft selection"
        action: "ref"
        xml_id: "ssi_school_learning_artifact.selection__school_learning_artifact__state__draft"
        save_as: "sel_draft"

      - step: "Assert draft selection"
        action: "assert"
        target: "sel_draft"
        asserts:
          name:
            type: "value"
            expected: "Draft"
          sequence:
            type: "value"
            expected: 0

      - step: "Get confirm selection"
        action: "ref"
        xml_id: "ssi_school_learning_artifact.selection__school_learning_artifact__state__confirm"
        save_as: "sel_confirm"

      - step: "Assert confirm selection"
        action: "assert"
        target: "sel_confirm"
        asserts:
          name:
            type: "value"
            expected: "Waiting for Approval"
          sequence:
            type: "value"
            expected: 1

      - step: "Get reject selection"
        action: "ref"
        xml_id: "ssi_school_learning_artifact.selection__school_learning_artifact__state__reject"
        save_as: "sel_reject"

      - step: "Assert reject selection"
        action: "assert"
        target: "sel_reject"
        asserts:
          name:
            type: "value"
            expected: "Rejected"
          sequence:
            type: "value"
            expected: 2

      - step: "Get open selection"
        action: "ref"
        xml_id: "ssi_school_learning_artifact.selection__school_learning_artifact__state__open"
        save_as: "sel_open"

      - step: "Assert open selection"
        action: "assert"
        target: "sel_open"
        asserts:
          name:
            type: "value"
            expected: "On Progress"
          sequence:
            type: "value"
            expected: 3

      - step: "Get done selection"
        action: "ref"
        xml_id: "ssi_school_learning_artifact.selection__school_learning_artifact__state__done"
        save_as: "sel_done"

      - step: "Assert done selection"
        action: "assert"
        target: "sel_done"
        asserts:
          name:
            type: "value"
            expected: "Curated"
          sequence:
            type: "value"
            expected: 4

      - step: "Get cancel selection"
        action: "ref"
        xml_id: "ssi_school_learning_artifact.selection__school_learning_artifact__state__cancel"
        save_as: "sel_cancel"

      - step: "Assert cancel selection"
        action: "assert"
        target: "sel_cancel"
        asserts:
          name:
            type: "value"
            expected: "Cancelled"
          sequence:
            type: "value"
            expected: 5
