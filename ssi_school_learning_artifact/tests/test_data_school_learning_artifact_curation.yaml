options:
  auto_refresh: true

setup:
  steps:
    - step: "Setup - create grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "Grade Type for Curation Test"
        code: "/"
        sequence: 10

    - step: "Setup - create branch"
      action: "create"
      model: "school_branch"
      save_as: "branch"
      values:
        name: "Branch for Curation Test"
        code: "/"

    - step: "Setup - create school"
      action: "create"
      model: "school"
      save_as: "school"
      values:
        name: "School for Curation Test"
        code: "/"
        grade_type_id: "REC: grade_type.id"
        branch_id: "REC: branch.id"

    - step: "Setup - create grade"
      action: "create"
      model: "school_grade"
      save_as: "grade"
      values:
        name: "Grade for Curation Test"
        code: "/"
        sequence: 10
        type_id: "REC: grade_type.id"

    - step: "Setup - create grade class"
      action: "create"
      model: "school_grade_class"
      save_as: "grade_class"
      values:
        name: "Class for Curation Test"
        code: "/"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        capacity: 30

    - step: "Setup - create academic year"
      action: "create"
      model: "school_academic_year"
      save_as: "academic_year"
      values:
        name: "Year for Curation Test"
        code: "/"
        date_start: "2026-07-01"
        date_end: "2027-06-30"

    - step: "Setup - create student contact"
      action: "create"
      model: "res.partner"
      save_as: "contact"
      values:
        name: "Student Contact for Curation Test"

    - step: "Setup - create student"
      action: "create"
      model: "school_student"
      save_as: "student"
      values:
        name: "Student for Curation Test"
        code: "/"
        contact_id: "REC: contact.id"
        school_id: "REC: school.id"

    - step: "Setup - create learning area"
      action: "create"
      model: "school_learning_artifact_area"
      save_as: "area"
      values:
        name: "Area for Curation Test"
        code: "/"
        school_id: "REC: school.id"
        area_type: "subject"

    - step: "Setup - create category"
      action: "create"
      model: "school_learning_artifact_category"
      save_as: "category"
      values:
        name: "Category for Curation Test"
        code: "/"

    - step: "Setup - create statuses"
      action: "create"
      model: "school_learning_artifact_curation_status"
      save_as: "st_eligible"
      values:
        name: "Status Eligible"
        code: "/"
        category: "eligible"
        school_ids: [[6, 0, ["REC: school.id"]]]

    - step: "Setup - create revision status"
      action: "create"
      model: "school_learning_artifact_curation_status"
      save_as: "st_revision"
      values:
        name: "Status Revision"
        code: "/"
        category: "revision"
        school_ids: [[6, 0, ["REC: school.id"]]]

    - step: "Setup - create archive status"
      action: "create"
      model: "school_learning_artifact_curation_status"
      save_as: "st_archive"
      values:
        name: "Status Archive"
        code: "/"
        category: "archive"
        school_ids: [[6, 0, ["REC: school.id"]]]

    - step: "Setup - create rejected status"
      action: "create"
      model: "school_learning_artifact_curation_status"
      save_as: "st_rejected"
      values:
        name: "Status Rejected"
        code: "/"
        category: "rejected"
        school_ids: [[6, 0, ["REC: school.id"]]]

scenarios:
  - name: "CRUD of status and rubric"
    steps:
      - step: "Create rubric"
        action: "create"
        model: "school_learning_artifact_rubric"
        save_as: "rubric_crud"
        values:
          name: "Rubric rubric_crud"
          code: "/"
          school_ids: [[6, 0, ["REC: school.id"]]]
          ethics_fail_status_id: "REC: st_rejected.id"
          knockout_status_id: "REC: st_archive.id"
          criterion_ids:
            - - 0
              - 0
              - sequence: 10
                code: "A1"
                name: "Aspect A1"
                aspect_type: "score"
                level_ids:
                  - - 0
                    - 0
                    - sequence: 10
                      score: 1
                      name: "Level 1"
                  - - 0
                    - 0
                    - sequence: 20
                      score: 2
                      name: "Level 2"
                  - - 0
                    - 0
                    - sequence: 30
                      score: 3
                      name: "Level 3"
                knockout_score: 1
                assessor_slot: "primary"
            - - 0
              - 0
              - sequence: 20
                code: "A2"
                name: "Aspect A2"
                aspect_type: "score"
                level_ids:
                  - - 0
                    - 0
                    - sequence: 10
                      score: 1
                      name: "Level 1"
                  - - 0
                    - 0
                    - sequence: 20
                      score: 2
                      name: "Level 2"
                  - - 0
                    - 0
                    - sequence: 30
                      score: 3
                      name: "Level 3"
                knockout_score: 0
                assessor_slot: "primary"
            - - 0
              - 0
              - sequence: 30
                code: "A3"
                name: "Aspect A3"
                aspect_type: "score"
                level_ids:
                  - - 0
                    - 0
                    - sequence: 10
                      score: 1
                      name: "Level 1"
                  - - 0
                    - 0
                    - sequence: 20
                      score: 2
                      name: "Level 2"
                  - - 0
                    - 0
                    - sequence: 30
                      score: 3
                      name: "Level 3"
                knockout_score: 0
                assessor_slot: "primary"
            - - 0
              - 0
              - sequence: 40
                code: "A4"
                name: "Aspect A4"
                aspect_type: "score"
                level_ids:
                  - - 0
                    - 0
                    - sequence: 10
                      score: 1
                      name: "Level 1"
                  - - 0
                    - 0
                    - sequence: 20
                      score: 2
                      name: "Level 2"
                  - - 0
                    - 0
                    - sequence: 30
                      score: 3
                      name: "Level 3"
                knockout_score: 0
                assessor_slot: "primary"
            - - 0
              - 0
              - sequence: 90
                code: "EG"
                name: "Ethics Gate"
                aspect_type: "gate"
                assessor_slot: "secondary"
                level_ids:
                  - - 0
                    - 0
                    - sequence: 10
                      name: "Pass"
                      is_fail: false
                  - - 0
                    - 0
                    - sequence: 20
                      name: "Fail"
                      is_fail: true
          threshold_ids:
            - - 0
              - 0
              - min_total: 10
                status_id: "REC: st_eligible.id"
            - - 0
              - 0
              - min_total: 7
                status_id: "REC: st_revision.id"
            - - 0
              - 0
              - min_total: 4
                status_id: "REC: st_archive.id"

      - step: "Assert rubric_crud"
        action: "assert"
        target: "rubric_crud"
        asserts:
          active:
            type: "value"
            expected: True
          criterion_ids:
            type: "o2m"
            check: "count"
            expected_count: 5
          threshold_ids:
            type: "o2m"
            check: "count"
            expected_count: 3
          max_revision:
            type: "value"
            expected: 1

      - step: "Find aspect A1 of rubric_crud"
        action: "search"
        model: "school_learning_artifact_rubric_criterion"
        domain: [["rubric_id", "=", "REC: rubric_crud.id"], ["code", "=", "A1"]]
        save_as: "criterion_a1"
        limit: 1
        expect_count: 1

      - step: "Assert score range follows the levels of A1"
        action: "assert"
        target: "criterion_a1"
        asserts:
          aspect_type:
            type: "value"
            expected: "score"
          min_score:
            type: "value"
            expected: 1
          max_score:
            type: "value"
            expected: 3
          level_ids:
            type: "o2m"
            check: "count"
            expected_count: 3

      - step: "Archive status"
        action: "write"
        target: "st_archive"
        values:
          active: false

      - step: "Assert status archived"
        action: "assert"
        target: "st_archive"
        asserts:
          active:
            type: "value"
            operator: "is_falsy"
          category:
            type: "value"
            expected: "archive"

