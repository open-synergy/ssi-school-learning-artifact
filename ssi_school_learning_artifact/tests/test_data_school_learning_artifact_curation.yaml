      - step: "Assert artifact"
        action: "assert"
        target: "artifact"
        asserts:
          total_score:
            type: "value"
            expected: 12
          curation_status_id:
            type: "m2o"
            expected: "REC: st_eligible"
          curation_status_category:
            type: "value"
            expected: "eligible"

