options:
  auto_refresh: true

setup:
  steps:
    - step: "Setup - create grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "Grade Type for Showcase Test"
        code: "/"
        sequence: 10
    - step: "Setup - create school"
      action: "create"
      model: "school"
      save_as: "school"
      values:
        name: "School for Showcase Test"
        code: "/"
        grade_type_id: "REC: grade_type.id"
    - step: "Setup - create grade"
      action: "create"
      model: "school_grade"
      save_as: "grade"
      values:
        name: "Grade for Showcase Test"
        code: "/"
        sequence: 10
        type_id: "REC: grade_type.id"
    - step: "Setup - create grade class"
      action: "create"
      model: "school_grade_class"
      save_as: "grade_class"
      values:
        name: "Class for Showcase Test"
        code: "/"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        capacity: 30
    - step: "Setup - create academic year"
      action: "create"
      model: "school_academic_year"
      save_as: "academic_year"
      values:
        name: "Year for Showcase Test"
        code: "/"
        date_start: "2026-07-01"
        date_end: "2027-06-30"
    - step: "Setup - create contact a"
      action: "create"
      model: "res.partner"
      save_as: "contact_a"
      values:
        name: "Student Contact a for Showcase Test"
    - step: "Setup - create student a"
      action: "create"
      model: "school_student"
      save_as: "student_a"
      values:
        name: "Student a for Showcase Test"
        code: "/"
        contact_id: "REC: contact_a.id"
        school_id: "REC: school.id"
    - step: "Setup - create contact b"
      action: "create"
      model: "res.partner"
      save_as: "contact_b"
      values:
        name: "Student Contact b for Showcase Test"
    - step: "Setup - create student b"
      action: "create"
      model: "school_student"
      save_as: "student_b"
      values:
        name: "Student b for Showcase Test"
        code: "/"
        contact_id: "REC: contact_b.id"
        school_id: "REC: school.id"
    - step: "Setup - create learning area"
      action: "create"
      model: "school_learning_artifact_area"
      save_as: "area"
      values:
        name: "Area for Showcase Test"
        code: "/"
        school_id: "REC: school.id"
        area_type: "subject"
    - step: "Setup - create category"
      action: "create"
      model: "school_learning_artifact_category"
      save_as: "category"
      values:
        name: "Category for Showcase Test"
        code: "/"
    - step: "Setup - create privacy notice"
      action: "create"
      model: "partner_consent_notice"
      save_as: "notice"
      values:
        name: "Notice for Showcase Test"
        code: "/"
        version: "1.0"
        body: "Privacy notice text"
    - step: "Setup - create assessment purpose"
      action: "create"
      model: "partner_consent_purpose"
      save_as: "purpose_assessment"
      values:
        name: "Purpose assessment for Showcase Test"
        code: "/"
        learning_artifact_usage: "assessment"
    - step: "Setup - create publication purpose"
      action: "create"
      model: "partner_consent_purpose"
      save_as: "purpose_publication"
      values:
        name: "Purpose publication for Showcase Test"
        code: "/"
        learning_artifact_usage: "publication"
    - step: "Setup - create promotion purpose"
      action: "create"
      model: "partner_consent_purpose"
      save_as: "purpose_promotion"
      values:
        name: "Purpose promotion for Showcase Test"
        code: "/"
        learning_artifact_usage: "promotion"
    - step: "Setup - create eligible status"
      action: "create"
      model: "school_learning_artifact_curation_status"
      save_as: "st_eligible"
      values:
        name: "Showcase Status eligible"
        code: "/"
        category: "eligible"
        school_ids: [[6, 0, ["REC: school.id"]]]
    - step: "Setup - create revision status"
      action: "create"
      model: "school_learning_artifact_curation_status"
      save_as: "st_revision"
      values:
        name: "Showcase Status revision"
        code: "/"
        category: "revision"
        school_ids: [[6, 0, ["REC: school.id"]]]
    - step: "Setup - create rejected status"
      action: "create"
      model: "school_learning_artifact_curation_status"
      save_as: "st_rejected"
      values:
        name: "Showcase Status rejected"
        code: "/"
        category: "rejected"
        school_ids: [[6, 0, ["REC: school.id"]]]
    - step: "Setup - create rubric"
      action: "create"
      model: "school_learning_artifact_rubric"
      save_as: "rubric"
      values:
        name: "Rubric for Showcase Test"
        code: "/"
        school_ids: [[6, 0, ["REC: school.id"]]]
        ethics_fail_status_id: "REC: st_rejected.id"
        criterion_ids:
          - - 0
            - 0
            - sequence: 10
              code: "A1"
              name: "Aspect A1"
              max_score: 3
              knockout_score: 0
              assessor_slot: "primary"
        threshold_ids:
          - - 0
            - 0
            - min_total: 3
              status_id: "REC: st_eligible.id"
          - - 0
            - 0
            - min_total: 1
              status_id: "REC: st_revision.id"
    - step: "Setup - create initial stage"
      action: "create"
      model: "school_learning_artifact_showcase_stage"
      save_as: "stage_initial"
      values:
        name: "Initial Stage"
        code: "/"
        sequence: 10
        school_ids: [[6, 0, ["REC: school.id"]]]
    - step: "Setup - create gated stage"
      action: "create"
      model: "school_learning_artifact_showcase_stage"
      save_as: "stage_gated"
      values:
        name: "Gated Stage"
        code: "/"
        sequence: 20
        require_eligible: true
        require_publication_consent: true
        school_ids: [[6, 0, ["REC: school.id"]]]

scenarios:
  - name: "CRUD of showcase stage and channel"
    steps:
      - step: "Create stage"
        action: "create"
        model: "school_learning_artifact_showcase_stage"
        save_as: "stage_crud"
        values:
          name: "CRUD Stage"
          code: "/"
          sequence: 5
          fold: true
      - step: "Assert stage"
        action: "assert"
        target: "stage_crud"
        asserts:
          sequence:
            type: "value"
            expected: 5
          fold:
            type: "value"
            expected: true
          require_eligible:
            type: "value"
            expected: false
      - step: "Write stage"
        action: "write"
        target: "stage_crud"
        values:
          require_eligible: true
      - step: "Assert stage after write"
        action: "assert"
        target: "stage_crud"
        asserts:
          require_eligible:
            type: "value"
            expected: true
      - step: "Create channel"
        action: "create"
        model: "school_learning_artifact_showcase_channel"
        save_as: "channel_crud"
        values:
          name: "CRUD Channel"
          code: "/"
          content_guideline: "Keep it short"
      - step: "Write channel"
        action: "write"
        target: "channel_crud"
        values:
          content_guideline: "Keep it long"
      - step: "Assert channel"
        action: "assert"
        target: "channel_crud"
        asserts:
          content_guideline:
            type: "value"
            expected: "Keep it long"
      - step: "Unlink channel"
        action: "unlink"
        target: "channel_crud"
      - step: "Unlink stage"
        action: "unlink"
        target: "stage_crud"
  - name: "Production content word count"
    steps:
      - step: "Create artifact artifact"
        action: "create"
        model: "school_learning_artifact"
        save_as: "artifact"
        values:
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          grade_class_id: "REC: grade_class.id"
          activity_name: "Showcase Activity"
          media_type: "photo"
          user_id: "REF: base.user_admin"
          student_ids: [[6, 0, ["REC: student_a.id"]]]
          learning_area_id: "REC: area.id"
          category_id: "REC: category.id"
          description: "one two three"
          link_url: "https://drive.example.com/file"
      - step: "Create channel"
        action: "create"
        model: "school_learning_artifact_showcase_channel"
        save_as: "channel"
        values:
          name: "Word Channel"
          code: "/"
      - step: "Create production"
        action: "create"
        model: "school_learning_artifact_showcase_production"
        save_as: "production"
        values:
          artifact_id: "REC: artifact.id"
          channel_id: "REC: channel.id"
          content: "a b c d"
      - step: "Assert word count"
        action: "assert"
        target: "production"
        asserts:
          content_word_count:
            type: "value"
            expected: 4
  - name: "Done gives the lowest sequence stage that applies to the school"
    steps:
      - step: "Create other school"
        action: "create"
        model: "school"
        save_as: "school_other"
        values:
          name: "Other School for Showcase Test"
          code: "/"
          grade_type_id: "REC: grade_type.id"
      - step: "Create stage stage_lowest"
        action: "create"
        model: "school_learning_artifact_showcase_stage"
        save_as: "stage_lowest"
        values:
          name: "stage_lowest"
          code: "/"
          sequence: 5
          school_ids: [[6, 0, ["REC: school.id"]]]
      - step: "Create stage of another school"
        action: "create"
        model: "school_learning_artifact_showcase_stage"
        save_as: "stage_foreign"
        values:
          name: "Foreign Stage"
          code: "/"
          sequence: 1
          school_ids: [[6, 0, ["REC: school_other.id"]]]
      - step: "Create artifact artifact"
        action: "create"
        model: "school_learning_artifact"
        save_as: "artifact"
        values:
          school_id: "REC: school.id"
          academic_year_id: "REC: academic_year.id"
          grade_class_id: "REC: grade_class.id"
          activity_name: "Showcase Activity"
          media_type: "photo"
          user_id: "REF: base.user_admin"
          student_ids: [[6, 0, ["REC: student_a.id"]]]
          learning_area_id: "REC: area.id"
          category_id: "REC: category.id"
          description: "one two three"
          link_url: "https://drive.example.com/file"
      - step: "Assert no stage before done"
        action: "assert"
        target: "artifact"
        asserts:
          showcase_stage_id:
            type: "value"
            operator: "is_falsy"
      - step: "Submit artifact"
        action: "call"
        target: "artifact"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve artifact"
        action: "call"
        target: "artifact"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Ethics pass artifact"
        action: "write"
        target: "artifact"
        values:
          ethics_result: "pass"
      - step: "Find score of artifact"
        action: "search"
        model: "school_learning_artifact_score"
        save_as: "score_artifact"
        domain: [["artifact_id", "=", "REC: artifact.id"]]
        limit: 1
        expect_count: 1
      - step: "Score artifact"
        action: "write"
        target: "score_artifact"
        values:
          score: 3
      - step: "Done artifact"
        action: "call"
        target: "artifact"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"
      - step: "Assert initial stage"
        action: "assert"
        target: "artifact"
        asserts:
          showcase_stage_id:
            type: "m2o"
            expected: "REC: stage_lowest"
