            expected: false
      - step: "Assert production_limited"
        action: "assert"
        target: "production_limited"
        asserts:
          channel_consent_ok:
            type: "value"
            expected: true
          ready:
            type: "value"
            expected: true
      - step: "Set ready on the production that no longer meets the channel is rejected"
        action: "write"
        target: "production_full"
        expect_error:
          type: "UserError"
          message_contains: "requires a full publication consent"
        values:
          ready: true
      - step: "Edit the note of the production that no longer meets the channel"
        action: "write"
        target: "production_full"
        values:
          note: "still editable"
      - step: "Assert production_full"
        action: "assert"
        target: "production_full"
        asserts:
          note:
            type: "value"
            expected: "still editable"
